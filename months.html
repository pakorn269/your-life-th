<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ชีวิตของคุณในแต่ละเดือน - โต้ตอบได้</title>
  <meta name="description" content="กรอกวันเกิดของคุณเพื่อดูชีวิตของคุณในแต่ละเดือน อ้างอิงจากบทความของ Tim Urban จาก Wait But Why.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" href="months-favicon.png" sizes="32x32">
  <link rel="stylesheet" href="your-life.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container py-5">
    <div class="row justify-content-center mb-4">
      <div class="col-auto">
        <h1 class="display-5 fw-bold text-primary">ชีวิตของคุณในเดือน</h1>
      </div>
      <div class="col-auto">
        <select name="unitbox" class="form-select form-select-lg" id="unitbox" required>
          <option value="years">ปี</option>
          <option value="months" selected>เดือน</option>
          <option value="weeks">สัปดาห์</option>
        </select>
      </div>
    </div>
    <form class="row g-3 justify-content-center align-items-end mb-4">
      <div class="col-auto">
        <label for="month" class="form-label visually-hidden">เดือน</label>
        <select name="month" class="form-select" id="month" required>
          <option value="0">มกราคม</option>
          <option value="1">กุมภาพันธ์</option>
          <option value="2">มีนาคม</option>
          <option value="3">เมษายน</option>
          <option value="4">พฤษภาคม</option>
          <option value="5">มิถุนายน</option>
          <option value="6">กรกฎาคม</option>
          <option value="7">สิงหาคม</option>
          <option value="8">กันยายน</option>
          <option value="9">ตุลาคม</option>
          <option value="10">พฤศจิกายน</option>
          <option value="11">ธันวาคม</option>
        </select>
      </div>
      <div class="col-auto">
        <label for="day" class="form-label visually-hidden">วัน</label>
        <input type="text" class="form-control" id="day" placeholder="31" pattern="\d{0,2}" required/>
      </div>
      <div class="col-auto">
        <label for="year" class="form-label visually-hidden">ปี (พ.ศ.)</label>
        <input type="text" class="form-control" id="year" placeholder="2568" pattern="\d{4}" required/>
        <div class="form-text">กรุณากรอกปีเกิดเป็น พ.ศ. (B.E.)</div>
      </div>
    </form>
    <ol class="chart justify-content-center"></ol>
    <div class="text-center text-secondary mt-4">
      <p>อ้างอิงจาก <a href="http://waitbutwhy.com/2014/05/life-weeks.html" class="link-secondary">Your Life in Weeks</a> โดย Tim Urban จาก <a href="http://waitbutwhy.com/" class="link-secondary">Wait But Why</a>.</p>
      <p class="print-hide"><a href="https://github.com/bryanbraun/your-life" class="link-secondary">ดูโค้ดบน Github</a></p>
      <p class="print-hide"><a href="javascript:window.print()" class="btn btn-outline-secondary btn-sm">พิมพ์หน้านี้</a></p>
    </div>
  </div>
  <script src="your-life.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Buddhist Era (BE) to Common Era (CE) conversion for all pages
    document.querySelector('form').addEventListener('submit', function(e) {
      e.preventDefault();
    });
    const yearInput = document.getElementById('year');
    function updateYearCE() {
      let val = parseInt(yearInput.value, 10);
      if (!isNaN(val) && val > 2100) { // likely BE
        yearInput.dataset.ce = val - 543;
      } else {
        yearInput.dataset.ce = val;
      }
    }
    yearInput.addEventListener('change', updateYearCE);
    yearInput.addEventListener('input', updateYearCE);
    // Patch for your-life.js to use CE from dataset if available
    window._getDateOfBirth = function() {
      const yearVal = yearInput.dataset.ce ? parseInt(yearInput.dataset.ce, 10) : parseInt(yearInput.value, 10);
      return new Date(yearVal, document.getElementById('month').value, document.getElementById('day').value);
    };
    // Initialize on page load
    updateYearCE();
  </script>
</body>
</html>
